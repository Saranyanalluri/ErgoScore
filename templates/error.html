<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoScore — Error</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <div class="brand">
        <span class="brand-mark">ErgoScore</span>
        <span class="brand-tagline">Video-based ergonomic risk assessment</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card error-card">
      <h2>Something went wrong</h2>
      <p>{{ message }}</p>
      <a href="{{ url_for('main.index') }}" class="btn-primary">Return to upload page</a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>ErgoScore — Innovate Without Borders Hackathon</p>
    </div>
  </footer>
</body>
</html>
